name: Build APK

# Tự động chạy mỗi khi bạn push code lên nhánh main,
# hoặc bấm "Run workflow" thủ công trong tab Actions.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cài đặt Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK debug
        run: gradle assembleDebug

      # APK build xong sẽ được đính kèm ở đây, vào tab Actions -> lần build ->
      # phần "Artifacts" phía dưới để tải file .apk về điện thoại.
      - name: Tải APK lên làm Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
